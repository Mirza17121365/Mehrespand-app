name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # لینک کانال یوتیوب را اینجا عوض کنید (مثلا https://m.youtube.com/@نام_کانال/videos)
  VIDEOS_URL: "https://m.youtube.com/results?search_query=mehrespand"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MehrespandApp"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ir.mehrespand.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "ir.mehrespand.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Mehrespand">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">مهراسپند</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Mehrespand" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          mkdir -p app/src/main/java/ir/mehrespand/app
          cat > app/src/main/java/ir/mehrespand/app/MainActivity.kt <<'EOF'
          package ir.mehrespand.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.ViewGroup
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Call
          import androidx.compose.material.icons.filled.Email
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.LocationOn
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.ShoppingCart
          import androidx.compose.material3.Button
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.NavigationBar
          import androidx.compose.material3.NavigationBarItem
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView

          // ---------- فقط این بخش را در صورت نیاز ویرایش کن ----------
          object Config {
              const val SHOP_URL = "https://mehrespand.ir/"
              // برای نمایش کانال خودتان، این را با لینک واقعی کانال یوتیوب عوض کنید
              // مثال: "https://m.youtube.com/@نام_کانال/videos"
              const val VIDEOS_URL = "__VIDEOS_URL__"
              const val PHONE = "09123873563"
              const val EMAIL = ""    // اگر ایمیل دارید اینجا بنویسید، دکمه ایمیل خودکار نمایش داده می‌شود
              const val ADDRESS = ""  // اگر آدرس دارید اینجا بنویسید
              const val MAP_QUERY = "شرکت تبرید صنعت مهراسپند تهران"
          }
          // ------------------------------------------------------------------

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              AppRoot()
                          }
                      }
                  }
              }
          }

          enum class Tab(val title: String, val icon: ImageVector) {
              Shop("فروشگاه", Icons.Filled.ShoppingCart),
              Videos("آموزش‌ها", Icons.Filled.PlayArrow),
              Contact("تماس با ما", Icons.Filled.Call)
          }

          @SuppressLint("SetJavaScriptEnabled")
          private fun createWebView(context: Context, url: String): WebView = WebView(context).apply {
              settings.javaScriptEnabled = true
              settings.domStorageEnabled = true // لازم برای سبد خرید ووکامرس
              webViewClient = object : WebViewClient() {
                  override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                      val scheme = request.url.scheme ?: return false
                      return when (scheme) {
                          "tel", "mailto", "geo" -> {
                              try {
                                  context.startActivity(Intent(Intent.ACTION_VIEW, request.url))
                              } catch (_: Exception) {
                              }
                              true
                          }
                          "intent" -> true // لینک‌های باز کردن اپ‌های دیگر نادیده گرفته می‌شوند
                          else -> false
                      }
                  }
              }
              loadUrl(url)
          }

          @Composable
          fun AppRoot() {
              val context = LocalContext.current
              var tab by remember { mutableStateOf(Tab.Shop) }
              val shop = remember { createWebView(context, Config.SHOP_URL) }
              val videos = remember { createWebView(context, Config.VIDEOS_URL) }

              // دکمه برگشت: اول داخل صفحات وب، بعد به تب فروشگاه، بعد خروج
              BackHandler {
                  val web = when (tab) {
                      Tab.Shop -> shop
                      Tab.Videos -> videos
                      Tab.Contact -> null
                  }
                  when {
                      web?.canGoBack() == true -> web.goBack()
                      tab != Tab.Shop -> tab = Tab.Shop
                      else -> (context as? Activity)?.finish()
                  }
              }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          Tab.values().forEach { t ->
                              NavigationBarItem(
                                  selected = tab == t,
                                  onClick = { tab = t },
                                  icon = { Icon(t.icon, contentDescription = t.title) },
                                  label = { Text(t.title) }
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(Modifier.padding(padding).fillMaxSize()) {
                      when (tab) {
                          Tab.Shop -> WebScreen(shop)
                          Tab.Videos -> WebScreen(videos)
                          Tab.Contact -> ContactScreen()
                      }
                  }
              }
          }

          @Composable
          fun WebScreen(webView: WebView) {
              AndroidView(
                  modifier = Modifier.fillMaxSize(),
                  factory = {
                      (webView.parent as? ViewGroup)?.removeView(webView)
                      webView
                  }
              )
          }

          @Composable
          fun ContactScreen() {
              val context = LocalContext.current

              fun open(intent: Intent) {
                  try {
                      context.startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text("شرکت تبرید صنعت مهراسپند", style = MaterialTheme.typography.headlineSmall)
                  Text("تلفن: ${Config.PHONE}", style = MaterialTheme.typography.bodyLarge)
                  if (Config.ADDRESS.isNotBlank()) {
                      Text(Config.ADDRESS, style = MaterialTheme.typography.bodyLarge)
                  }

                  Button(
                      modifier = Modifier.fillMaxWidth(),
                      onClick = { open(Intent(Intent.ACTION_DIAL, Uri.parse("tel:${Config.PHONE}"))) }
                  ) {
                      Icon(Icons.Filled.Call, contentDescription = null)
                      Text("  تماس تلفنی")
                  }
                  Button(
                      modifier = Modifier.fillMaxWidth(),
                      onClick = { open(Intent(Intent.ACTION_VIEW, Uri.parse(Config.SHOP_URL))) }
                  ) {
                      Icon(Icons.Filled.Home, contentDescription = null)
                      Text("  مشاهده وب‌سایت")
                  }
                  if (Config.EMAIL.isNotBlank()) {
                      Button(
                          modifier = Modifier.fillMaxWidth(),
                          onClick = { open(Intent(Intent.ACTION_SENDTO, Uri.parse("mailto:${Config.EMAIL}"))) }
                      ) {
                          Icon(Icons.Filled.Email, contentDescription = null)
                          Text("  ارسال ایمیل")
                      }
                  }
                  Button(
                      modifier = Modifier.fillMaxWidth(),
                      onClick = {
                          open(Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=${Uri.encode(Config.MAP_QUERY)}")))
                      }
                  ) {
                      Icon(Icons.Filled.LocationOn, contentDescription = null)
                      Text("  مسیریابی روی نقشه")
                  }
              }
          }
          EOF
          ESC="${VIDEOS_URL//&/\\&}"
          sed -i "s|__VIDEOS_URL__|$ESC|" app/src/main/java/ir/mehrespand/app/MainActivity.kt

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mehrespand-apk
          path: app/build/outputs/apk/debug/app-debug.apk
